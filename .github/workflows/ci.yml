# The gate every pull request has to pass.
#
# `make check` is the same command the readme tells a contributor to run before
# opening a PR, so a green check here means the same thing it means locally:
# lint clean, every package compiles for every platform, and the tests pass.
# test-linux runs too when the runner has Docker; it self-skips when it does
# not, so the job stays green either way rather than failing on a missing tool.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: cidekar-anvil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # TEMPORARY probe: does this runner have cgo and a C compiler? -race needs
      # both. Remove this step once we know whether to keep -race or drop it.
      - name: Probe toolchain
        run: |
          echo "CGO_ENABLED=$(go env CGO_ENABLED)"
          echo "CC=$(go env CC)"
          which gcc cc clang 2>&1 || echo "no C compiler on PATH"
          gcc --version 2>&1 | head -1 || true
      # Pinned to linux: this runner is Linux-only, so vetting and building the
      # windows and darwin backends (winrt-go, cbgo / CoreBluetooth) fails on
      # undefined platform types. Drop the pin once osx and windows runners exist.
      - run: make check PLATFORMS="linux"
